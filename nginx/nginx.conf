user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_status 429;

    # Upstream service definitions
    upstream auth_service {
        least_conn;
        server auth-service:3001 max_fails=3 fail_timeout=30s;
    }

    upstream vehicle_service {
        least_conn;
        server vehicle-service:3002 max_fails=3 fail_timeout=30s;
    }

    upstream inventory_service {
        least_conn;
        server inventory-service:3003 max_fails=3 fail_timeout=30s;
    }

    upstream transaction_service {
        least_conn;
        server transaction-service:3004 max_fails=3 fail_timeout=30s;
    }

    upstream people_service {
        least_conn;
        server people-service:3005 max_fails=3 fail_timeout=30s;
    }

    upstream integration_service {
        least_conn;
        server integration-service:3006 max_fails=3 fail_timeout=30s;
    }

    # Include additional config files
    include /etc/nginx/conf.d/*.conf;
}
